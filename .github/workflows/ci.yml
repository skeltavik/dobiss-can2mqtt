name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install hash-pinned dependencies
        run: uv pip install --system --require-hashes -r requirements-dev.txt
      - name: Verify immutable dependencies and Actions
        run: python scripts/check_pinned_dependencies.py
      - name: Compile
        run: python -m compileall -q can2mqtt.py tests
      - name: Test
        run: python -m pytest --cov=can2mqtt --cov-fail-under=85
      - name: Static security scan
        run: python -m bandit -q -r can2mqtt.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
